<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 h-screen bg-gray-900 text-white p-6">
        <h1 class="text-2xl font-bold mb-6 text-center">🔐 Cryptography</h1>
        <nav>
            <ul class="space-y-4">
                <li><button onclick="showSection('encrypt')" class="w-full text-left py-2 px-4 rounded bg-gray-700 hover:bg-gray-600">Encrypt</button></li>
                <li><button onclick="showSection('decrypt')" class="w-full text-left py-2 px-4 rounded bg-gray-700 hover:bg-gray-600">Decrypt</button></li>
                <li><button onclick="showSection('hash')" class="w-full text-left py-2 px-4 rounded bg-gray-700 hover:bg-gray-600">Generate Hash</button></li>
                <li><button onclick="showSection('encrypt-hash')" class="w-full text-left py-2 px-4 rounded bg-gray-700 hover:bg-gray-600">Encrypt & Hash</button></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
        <section id="encrypt" class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">🔑 Encrypt a File</h2>
            <div class="flex gap-3 justify-center mb-3">
                <label><input type="radio" name="hashType" value="text" checked> Text</label>
                <label><input type="radio" name="hashType" value="image"> Image</label>
                <label><input type="radio" name="hashType" value="audio"> Audio</label>
                <label><input type="radio" name="hashType" value="file"> Video</label>
            </div>
            <input type="file" id="encryptFile" class="block w-full mb-3 border p-2">
            <input type="text" id="encryptKey" placeholder="Enter Secret Key" class="block w-full mt-3 border p-2">
            <button onclick="encryptFile()" class="bg-blue-500 text-white py-2 px-4 rounded w-full mt-3">Encrypt</button>
            <p id="encryptOutput" class="mt-3 text-sm text-gray-600"></p>
            <a id="downloadEncryptFile" class="hidden bg-green-500 text-white py-2 px-4 rounded mt-2 inline-block">Download Encrypted File</a>
        </section>

        <section id="decrypt" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">🔓 Decrypt a File</h2>
            <div class="flex gap-3 justify-center mb-3">
                <label><input type="radio" name="hashType" value="text" checked> Text</label>
                <label><input type="radio" name="hashType" value="image"> Image</label>
                <label><input type="radio" name="hashType" value="audio"> Audio</label>
                <label><input type="radio" name="hashType" value="file"> Video</label>
            </div>
            <input type="file" id="decryptFile" class="block w-full mb-3 border p-2">
            <input type="text" id="decryptKey" placeholder="Enter Secret Key" class="block w-full mb-3 border p-2">
            <button onclick="decryptFile()" class="bg-red-500 text-white py-2 px-4 rounded w-full">Decrypt</button>
            <p id="decryptOutput" class="mt-3 text-sm text-gray-600"></p>
            <a id="downloadDecryptFile" class="hidden bg-green-500 text-white py-2 px-4 rounded mt-2 inline-block">Download Decrypted File</a>
        </section>

       <section id="hash" class="hidden bg-white p-6 rounded-lg shadow-md">
           <h2 class="text-2xl font-bold mb-4">🔢 Generate Hash</h2>

           <!-- Hash Type Selection -->
           <div class="flex gap-3 justify-center mb-3">
           <label><input type="radio" name="hashType" value="text" checked> Text</label>
           <label><input type="radio" name="hashType" value="image"> Image</label>
           <label><input type="radio" name="hashType" value="audio"> Audio</label>
           <label><input type="radio" name="hashType" value="video"> Video</label>
          </div>

    <input type="file" id="hashFile" class="block w-full mb-3 border p-2">
    <button onclick="generateHash()" class="bg-yellow-500 text-white py-2 px-4 rounded w-full">Generate Hash</button>
    
    <p id="hashOutput" class="mt-3 text-sm text-gray-600"></p>

    <!-- Download Hash File Button (Initially Hidden) -->
    <a id="downloadGenerateHashFile" class="hidden bg-green-500 text-white py-2 px-4 rounded mt-2 inline-block">
        📥 Download Hash File
    </a>
</section>

        

        <section id="encrypt-hash" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">🔐 Encrypt & Hash</h2>
            <div class="flex gap-3 justify-center mb-3">
                <label><input type="radio" name="hashType" value="text" checked> Text</label>
                <label><input type="radio" name="hashType" value="image"> Image</label>
                <label><input type="radio" name="hashType" value="audio"> Audio</label>
                <label><input type="radio" name="hashType" value="file"> Video</label>
            </div>
            <input type="file" id="encryptHashFile" class="block w-full mb-3 border p-2">
            <input type="password" id="encryptHashKey" placeholder="Enter Encryption Key" class="block w-full mb-3 border p-2">
            <button onclick="encryptAndHash()" class="bg-blue-500 text-white py-2 px-4 rounded w-full">Encrypt & Hash</button>
            
            <p id="encryptHashOutput" class="mt-3 text-sm text-gray-600"></p>
            
            <!-- Download Encrypted & Hashed File Button (Initially Hidden) -->
            <a id="downloadEncryptHashFile" class="hidden bg-green-500 text-white py-2 px-4 rounded mt-2 inline-block">
                📥 Download Encrypted & Hashed File
            </a>
        </section>
        
    </main>

<script>
    function showSection(id) {
        document.querySelectorAll("section").forEach(section => section.classList.add("hidden"));
        document.getElementById(id).classList.remove("hidden");
    }

    async function encryptFile() {
        let file = document.getElementById("encryptFile").files[0];
        let key = document.getElementById("encryptKey").value;

        if (!file || !key) {
            alert("⚠️ Please select a file and enter a secret key.");
            return;
        }

        let formData = new FormData();
        formData.append("file", file);
        formData.append("key", key);

        let response = await fetch("/encrypt", { method: "POST", body: formData });
        let data = await response.json();

        if (data.success) {
            document.getElementById("encryptOutput").innerText = "✅ Encrypted Successfully!";
            let button = document.getElementById("downloadEncryptFile");
            button.href = data.file_url;
            button.classList.remove("hidden");
        } else {
            alert("❌ Encryption failed: " + data.message);
        }
    }

    async function decryptFile() {
        let file = document.getElementById("decryptFile").files[0];
        let key = document.getElementById("decryptKey").value;

        if (!file || !key) {
            alert("⚠️ Please select an encrypted file and enter the secret key.");
            return;
        }

        let formData = new FormData();
        formData.append("file", file);
        formData.append("key", key);

        let response = await fetch("/decrypt", { method: "POST", body: formData });
        let data = await response.json();

        if (data.success) {
            document.getElementById("decryptOutput").innerText = "✅ Decrypted Successfully!";
            let button = document.getElementById("downloadDecryptFile");
            button.href = data.file_url;
            button.classList.remove("hidden");
        } else {
            alert("❌ Decryption failed: " + data.message);
        }
    }
    function showSection(id) {
        document.querySelectorAll("section").forEach(section => section.classList.add("hidden"));
        document.getElementById(id).classList.remove("hidden");
    }

    async function encryptFile() {
        let file = document.getElementById("encryptFile").files[0];
        let key = document.getElementById("encryptKey").value;

        if (!file || !key) {
            alert("⚠️ Please select a file and enter a secret key.");
            return;
        }

        let formData = new FormData();
        formData.append("file", file);
        formData.append("key", key);

        let response = await fetch("/encrypt", { method: "POST", body: formData });
        let data = await response.json();

        if (data.success) {
            document.getElementById("encryptOutput").innerText = "✅ Encrypted Successfully!";
            let button = document.getElementById("downloadEncryptFile");
            button.href = data.file_url;
            button.classList.remove("hidden");
        } else {
            alert("❌ Encryption failed: " + data.message);
        }
    }

    async function decryptFile() {
        let file = document.getElementById("decryptFile").files[0];
        let key = document.getElementById("decryptKey").value;

        if (!file || !key) {
            alert("⚠️ Please select an encrypted file and enter the secret key.");
            return;
        }

        let formData = new FormData();
        formData.append("file", file);
        formData.append("key", key);

        let response = await fetch("/decrypt", { method: "POST", body: formData });
        let data = await response.json();

        if (data.success) {
            document.getElementById("decryptOutput").innerText = "✅ Decrypted Successfully!";
            let button = document.getElementById("downloadDecryptFile");
            button.href = data.file_url;
            button.classList.remove("hidden");
        } else {
            alert("❌ Decryption failed: " + data.message);
        }
    }

    async function generateHash() {
    let file = document.getElementById("hashFile").files[0];

    if (!file) {
        alert("⚠️ Please select a file to generate hash.");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    let response = await fetch("/hash", { method: "POST", body: formData });
    let data = await response.json();

    if (data.success) {
        // Display the hash output
        document.getElementById("hashOutput").innerText = "🔢 Hash: " + data.hash;

        // Create a downloadable file containing the hash
        let hashFileContent = `File Name: ${file.name}\nSHA-256 Hash: ${data.hash}`;
        let blob = new Blob([hashFileContent], { type: "text/plain" });
        let url = URL.createObjectURL(blob);

        // Show the download button
        let downloadBtn = document.getElementById("downloadGenerateHashFile");
        downloadBtn.href = url;
        downloadBtn.download = `hashed_${file.name}.txt`;
        downloadBtn.classList.remove("hidden"); // Make the button visible
    } else {
        alert("❌ Hash generation failed: " + data.message);
    }
}

async function encryptAndHash() {
    let file = document.getElementById("encryptHashFile").files[0];
    let key = document.getElementById("encryptHashKey").value;

    if (!file || !key) {
        alert("⚠️ Please select a file and enter a key.");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);
    formData.append("key", key);

    let response = await fetch("/encrypt-hash", { method: "POST", body: formData });
    let data = await response.json();

    if (data.success) {
        // Display the hash output
        document.getElementById("encryptHashOutput").innerText = "🔢 Hash: " + data.hash;

        // Show the download button
        let downloadBtn = document.getElementById("downloadEncryptHashFile");
        downloadBtn.href = data.file_url;
        downloadBtn.download = `encrypted_hashed_${file.name}`;
        downloadBtn.classList.remove("hidden"); // Make the button visible
    } else {
        alert("❌ Encryption & Hashing failed: " + data.message);
    }
}

</script>

</body>
</html>
